name: Testy

# Beží pri každom pull requeste a po merge do main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    name: Worker API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # testy používajú len vstavaný node:sqlite, inštalácia balíkov netreba
      - run: npm test
        working-directory: worker

  scraper:
    name: Scraper (unit + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
        env:
          HOME: /root

  e2e:
    name: PWA E2E (mobil + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright test
        env:
          HOME: /root
      - name: Report a trace pri chybe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

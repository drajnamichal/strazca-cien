name: Kontrola cien

# Spúšťa ho Cloudflare Worker (cron každých 5 h a hneď po pridaní produktu).
# Beží na self-hosted runneri (tvoj Mac): obchody blokujú adresy dátových centier GitHubu,
# domáce pripojenie nie. Keď Mac spí, beh počká vo fronte a spustí sa po prebudení.
on:
  workflow_dispatch:
    inputs:
      product_id:
        description: 'ID produktu (prázdne = skontrolovať všetky)'
        required: false
        default: ''

concurrency:
  group: check-prices
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, strazca-cien]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Inštalácia závislostí
        run: npm ci

      - name: Prehliadač Chromium (stiahne sa len prvýkrát, potom je v cache)
        run: npx playwright install chromium

      - name: Unit testy extrakcie
        run: npm run test:unit

      - name: Kontrola cien
        run: node check.mjs
        env:
          API_URL: ${{ secrets.API_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PRODUCT_ID: ${{ inputs.product_id }}

name: Kanárik

# Raz denne overí scraper na živých e-shopoch (produkty v scraper/canary.config.mjs).
# Pri zlyhaní je beh červený (GitHub pošle e-mail), súhrn je v behu a príde aj Web Push.
on:
  schedule:
    - cron: '17 6 * * *' # každý deň o 6:17 UTC
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Kontrola živých e-shopov
        run: node canary.mjs
        env:
          HOME: /root
          API_URL: ${{ secrets.API_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

name: Kanárik

# Raz denne overí scraper na živých e-shopoch (produkty v scraper/canary.config.mjs).
# Beží na self-hosted runneri (tvoj Mac) z rovnakého dôvodu ako Kontrola cien.
# Pri zlyhaní je beh červený (GitHub pošle e-mail), súhrn je v behu a príde aj Web Push.
on:
  schedule:
    - cron: '17 6 * * *' # každý deň o 6:17 UTC
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    runs-on: [self-hosted, strazca-cien]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium
      - name: Kontrola živých e-shopov
        run: node canary.mjs
        env:
          API_URL: ${{ secrets.API_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

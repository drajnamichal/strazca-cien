name: Nasadenie

# Po úspešných testoch na main nasadí Worker + PWA a spustí nové migrácie D1.
on:
  workflow_run:
    workflows: [Testy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # nasadí presne ten commit, ktorý prešiel testami
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - name: Migrácie databázy
        run: npx wrangler d1 migrations apply strazca-cien --remote

      - name: Nasadenie Workera a PWA
        run: npx wrangler deploy

      - name: Smoke test nasadenej appky
        env:
          API_URL: ${{ secrets.API_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          set -e
          check() { # check <očakávaný kód> <popis> <curl argumenty...>
            expected=$1; label=$2; shift 2
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$@")
            if [ "$code" != "$expected" ]; then echo "✗ $label: HTTP $code (čakal som $expected)"; exit 1; fi
            echo "✓ $label"
          }
          check 200 "PWA sa načíta"              "$API_URL/"
          check 200 "manifest je dostupný"       "$API_URL/manifest.webmanifest"
          check 401 "API bez kľúča odmietne"     "$API_URL/api/products"
          check 200 "API s kľúčom odpovie"       -H "authorization: Bearer $API_TOKEN" "$API_URL/api/products"

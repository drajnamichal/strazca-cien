name = "strazca-cien"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# PWA sa servuje z rovnakého Workera (rovnaký origin, žiadny CORS)
[assets]
directory = "../pwa"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "strazca-cien"
database_id = "b9760b10-2041-4570-8aeb-9b56121d01d3"
migrations_dir = "migrations"

# Každých 5 hodín spustí GitHub Actions scraper
[triggers]
crons = ["0 */5 * * *"]

[vars]
GITHUB_REPO = "drajnamichal/strazca-cien"
GITHUB_REF = "main"
VAPID_PUBLIC_KEY = "BHxR7bKtZhP2WZECqqVMzoELKpzsmgoxKaMG6Lg_LAsL_-Q3YdaqgrB1xec5SpG4505odv-G-bPw9EikY_wbSQo"

# Tajomstvá (nastav cez `npx wrangler secret put ...`):
#   API_TOKEN     – tvoj tajný kľúč do appky (používa ho aj scraper)
#   GITHUB_TOKEN  – fine-grained PAT s právom Actions: Read and write na tento repozitár
